# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Minecraft / mapping versions (mappings channel = official Mojang mappings,
# the same channel the original Forge project used, so vanilla class/method
# names in the ported source stay as close as possible to the Forge version -
# though at 1.21.11 Mojang's own official mapping itself renamed
# ResourceLocation to Identifier; see README).
minecraft_version=1.21.11

# Fabric loader / API versions, targeting 1.21.11.
# 1.21.11 is (at the time of writing) the last obfuscated Minecraft version;
# the following version after it (26.1) removes obfuscation entirely and
# needs a different Loom plugin/setup, so do not blindly bump minecraft_version
# past 1.21.11 with this build.gradle.
loader_version=0.17.3
fabric_version=0.141.6+1.21.11

# Mod metadata
mod_id=elephantgreenscreeneffect
mod_name=ElephantGreenScreenEffect
mod_license=MIT
mod_version=1.0
mod_group_id=com.thewhiteninja.elephantgreenscreeneffect
mod_authors=TheWhiteNinja
mod_description=Elephant green screen effect.

# Loom (Gradle plugin) version. 1.21.11 is still an obfuscated version.
# Loom 1.14 introduced a dedicated 'net.fabricmc.fabric-loom-remap' plugin id
# for obfuscated versions, but only alpha builds are published under that id
# so far, so build.gradle uses the classic, stable 'fabric-loom' plugin id
# instead, which the Loom team kept publishing for backwards compatibility
# with obfuscated versions such as 1.21.11.
loom_version=1.14-SNAPSHOT
