plugins {
    // 1.21.11 is still an obfuscated Minecraft version. Loom introduced a
    // dedicated 'net.fabricmc.fabric-loom-remap' plugin id for obfuscated
    // versions, but as of this writing that id only has alpha builds
    // published, so this project uses the classic 'fabric-loom' id instead -
    // which the Loom team explicitly kept published for backwards
    // compatibility with obfuscated versions such as 1.21.11.
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft has required Java 21 since 1.20.5; unchanged from 1.21.1.
// This toolchain forces Gradle to use JDK 21 for compilation even if the
// IDE's own project SDK differs.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Use the official Mojang mappings (the same "official" mapping channel
    // the original Forge build used). Note: at 1.21.11 Mojang's own official
    // mapping renamed ResourceLocation to Identifier (net.minecraft.resources.Identifier);
    // see README for the full list of renamed/changed vanilla APIs this mod relies on.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
