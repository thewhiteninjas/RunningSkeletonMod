# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Minecraft / mapping versions (mappings channel = official Mojang mappings,
# the same channel the original Forge project used, so vanilla class/method
# names in the ported source stay identical to the Forge version).
minecraft_version=1.21.1

# Fabric loader / API versions.
# If IntelliJ's Gradle sync flags newer releases available for 1.21.1,
# it is safe to bump loader_version / fabric_version - this mod uses no
# internal/unstable Fabric API outside ClientTickEvents, HudRenderCallback
# and the v2 client-command API. Note: HudRenderCallback is deprecated
# starting with the 1.21.5 branch of Fabric API in favor of a new HUD-layer
# API, but it is still the correct, non-deprecated way to hook the HUD on
# 1.21.1, so do not bump past a 1.21.1-targeted Fabric API release.
loader_version=0.16.14
fabric_version=0.115.6+1.21.1

# Mod metadata
mod_id=elephantgreenscreeneffect
mod_name=ElephantGreenScreenEffect
mod_license=MIT
mod_version=1.0
mod_group_id=com.thewhiteninja.elephantgreenscreeneffect
mod_authors=TheWhiteNinja
mod_description=Elephant green screen effect.
